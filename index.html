<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLSHOP | Criar Conta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-register p-4">
                <div class="text-center mb-4">
                    <img src="assets/img/logo_clshop.PNG" alt="Logo CLSHOP" class="img-fluid mb-2" style="max-height: 70px;">
                    <h2 class="fw-bold text-uppercase tracking-wide text-white">CLSHOP</h2>
                    <p class="text-muted small">Crie a sua conta para ter acesso exclusivo a roupas, tênis e acessórios.</p>
                </div>

                <form action="processa_cadastro.php" method="POST">
                    <!-- Nome Completo -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="O seu nome completo" required>
                        </div>
                    </div>

                    <!-- E-mail -->
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
                        </div>
                    </div>

                    <!-- CPF -->
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                            <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                        </div>
                    </div>

                    <!-- Palavra-passe -->
                    <div class="mb-3">
                        <label for="senha" class="form-label">Palavra-passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Confirmar Palavra-passe -->
                    <div class="mb-4">
                        <label for="confirmar_senha" class="form-label">Confirmar Palavra-passe</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-clshop w-100 py-2 mb-3">
                        <i class="bi bi-person-plus me-2"></i> Criar Conta na CLSHOP
                    </button>

                    <!-- Link para Iniciar Sessão (Atualizado com login.html) -->
                    <div class="text-center">
                        <span class="small text-muted">Já tem uma conta? <a href="login.html" class="text-primary text-decoration-none fw-bold">Iniciar Sessão</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
